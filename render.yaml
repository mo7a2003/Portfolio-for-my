# ==============================================================================
# Render.com Blueprint Infrastructure as Code (render.yaml)
# Production Deployment for Laravel 11 REST API & PostgreSQL Database
# ==============================================================================
services:
  # ----------------------------------------------------------------------------
  # Web Service: Laravel 11 Production Docker Container
  # ----------------------------------------------------------------------------
  - type: web
    name: portfolio-backend-api
    runtime: docker
    plan: starter
    region: oregon
    branch: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    numInstances: 1
    disk:
      name: portfolio-uploads
      mountPath: /var/www/html/storage/app/public
      sizeGB: 5

    envVars:
      - key: APP_NAME
        value: "3D Portfolio API"

      - key: APP_ENV
        value: production

      - key: APP_DEBUG
        value: "false"

      - key: APP_KEY
        generateValue: true

      - key: APP_URL
        sync: false

      # Database Configuration (PostgreSQL / Supabase / Render Postgres)
      - key: DB_CONNECTION
        value: pgsql

      # Automatically injected from the managed PostgreSQL instance below
      # (If using Supabase Transaction Pooler, replace with your pooler URI: postgresql://postgres.[ref]:[pass]@aws-0-[region].pooler.supabase.com:6543/postgres)
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString

      - key: DB_SSLMODE
        value: require

      - key: PDO_EMULATE_PREPARES
        value: "true"

      # Multi-Origin CORS whitelist (update with your frontend production URL)
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:3000,http://localhost:5173,https://portfolio.vercel.app"

      - key: CORS_SUPPORTS_CREDENTIALS
        value: "true"

      # Automated Migrations & Seeding on Container Boot
      - key: RUN_MIGRATIONS
        value: "true"

      - key: RUN_SEEDER
        value: "true"

      # Standard Logging to Container Standard Output / Stderr for Render Log Aggregator
      - key: LOG_CHANNEL
        value: stderr

      - key: LOG_LEVEL
        value: info

      # Core Drivers configured for single-node container resilience
      - key: CACHE_STORE
        value: database

      - key: SESSION_DRIVER
        value: database

      - key: QUEUE_CONNECTION
        value: database

      - key: FILESYSTEM_DISK
        value: public

# ------------------------------------------------------------------------------
# Managed PostgreSQL Database Instance
# ------------------------------------------------------------------------------
databases:
  - name: portfolio-db
    databaseName: portfolio_production
    user: portfolio_admin
    plan: starter
    region: oregon
    ipAllowList: [] # Open to Render internal network and authorized IPs

