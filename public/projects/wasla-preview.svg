<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="50%" stop-color="#070c14"/>
      <stop offset="100%" stop-color="#03060a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe270"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" rx="16" fill="url(#bgGrad)"/>
  <rect width="600" height="380" rx="16" fill="none" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.5"/>

  <!-- Perspective Grid lines -->
  <g opacity="0.18" stroke="#00f0ff" stroke-width="1">
    <line x1="0" y1="260" x2="600" y2="260"/>
    <line x1="0" y1="290" x2="600" y2="290"/>
    <line x1="0" y1="320" x2="600" y2="320"/>
    <line x1="0" y1="350" x2="600" y2="350"/>
    <line x1="80" y1="240" x2="0" y2="380"/>
    <line x1="200" y1="240" x2="120" y2="380"/>
    <line x1="300" y1="240" x2="300" y2="380"/>
    <line x1="400" y1="240" x2="480" y2="380"/>
    <line x1="520" y1="240" x2="600" y2="380"/>
  </g>

  <!-- UI Window Header -->
  <rect x="25" y="24" width="550" height="40" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)"/>
  <circle cx="48" cy="44" r="5" fill="#ff5f56"/>
  <circle cx="66" cy="44" r="5" fill="#ffbd2e"/>
  <circle cx="84" cy="44" r="5" fill="#27c93f"/>
  <rect x="110" y="37" width="160" height="14" rx="4" fill="rgba(0, 240, 255, 0.15)"/>
  <text x="120" y="48" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#00f0ff" letter-spacing="1">WASLA // DASHBOARD</text>

  <!-- Isometric Dashboard Cards -->
  <!-- Left Card -->
  <rect x="40" y="85" width="160" height="150" rx="10" fill="rgba(11, 25, 44, 0.7)" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1.2"/>
  <rect x="55" y="105" width="60" height="10" rx="3" fill="rgba(255,255,255,0.4)"/>
  <text x="55" y="145" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="bold" fill="#ffffff">98.4%</text>
  <text x="55" y="165" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#00f0ff">Service Telemetry</text>
  <path d="M 55 210 Q 90 180 120 195 T 180 170" fill="none" stroke="#00f0ff" stroke-width="2.5" filter="url(#glowCyan)"/>

  <!-- Center Card (3D Isometric node) -->
  <g transform="translate(230, 80)">
    <rect width="200" height="160" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(212, 175, 55, 0.35)" stroke-width="1.5"/>
    <circle cx="100" cy="70" r="32" fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-dasharray="8 4"/>
    <circle cx="100" cy="70" r="18" fill="url(#cyanGrad)" opacity="0.8" filter="url(#glowCyan)"/>
    <!-- Orbiting nodes -->
    <circle cx="65" cy="50" r="6" fill="#ffe270"/>
    <circle cx="140" cy="85" r="5" fill="#00f0ff"/>
    <line x1="65" y1="50" x2="100" y2="70" stroke="rgba(255, 226, 112, 0.4)" stroke-width="1"/>
    <line x1="140" y1="85" x2="100" y2="70" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1"/>
    <rect x="30" y="125" width="140" height="8" rx="4" fill="rgba(255,255,255,0.1)"/>
    <rect x="30" y="125" width="105" height="8" rx="4" fill="url(#cyanGrad)"/>
    <text x="100" y="148" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#a0aec0" text-anchor="middle">REALTIME NODE SYNC</text>
  </g>

  <!-- Right Floating Metric -->
  <g transform="translate(450, 95)">
    <rect width="115" height="60" rx="8" fill="rgba(212, 175, 55, 0.08)" stroke="rgba(212, 175, 55, 0.3)"/>
    <text x="15" y="28" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#fbbf24">LATENCY</text>
    <text x="15" y="48" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="bold" fill="#ffffff">12 ms</text>

    <rect y="75" width="115" height="60" rx="8" fill="rgba(0, 240, 255, 0.08)" stroke="rgba(0, 240, 255, 0.3)"/>
    <text x="15" y="103" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#00f0ff">ACTIVE USERS</text>
    <text x="15" y="123" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="bold" fill="#ffffff">15.2K</text>
  </g>

  <!-- Bottom Accent Glow -->
  <circle cx="300" cy="380" r="140" fill="url(#cyanGrad)" opacity="0.12" filter="url(#glowCyan)"/>
</svg>

