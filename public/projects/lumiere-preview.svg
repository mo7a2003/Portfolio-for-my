<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="lumBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a0f"/>
      <stop offset="50%" stop-color="#0e070b"/>
      <stop offset="100%" stop-color="#050304"/>
    </linearGradient>
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="50%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="perfumeGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.4)"/>
      <stop offset="50%" stop-color="rgba(251, 113, 133, 0.2)"/>
      <stop offset="100%" stop-color="rgba(225, 29, 72, 0.6)"/>
    </linearGradient>
    <filter id="pinkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#lumBg)"/>
  <rect width="600" height="380" rx="16" fill="none" stroke="rgba(251, 113, 133, 0.35)" stroke-width="1.5"/>

  <!-- Top bar -->
  <rect x="25" y="24" width="550" height="38" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)"/>
  <text x="45" y="48" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" letter-spacing="2">LUMIÈRE // HAUTE COSMÉTIQUE 3D</text>
  <text x="490" y="48" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#fb7185">PARIS • TOKYO</text>

  <!-- Left: 3D Product Interactive Render (Luxury Perfume Bottle) -->
  <g transform="translate(100, 95)">
    <!-- Ambient Podia / Pedestal -->
    <ellipse cx="90" cy="220" rx="80" ry="22" fill="rgba(251, 113, 133, 0.12)" filter="url(#pinkGlow)"/>
    <ellipse cx="90" cy="215" rx="65" ry="14" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(251, 113, 133, 0.3)"/>

    <!-- Perfume Cap (Gold Metallic) -->
    <rect x="75" y="30" width="30" height="25" rx="4" fill="url(#roseGold)"/>
    <rect x="80" y="20" width="20" height="10" rx="2" fill="#fff" opacity="0.6"/>

    <!-- Perfume Bottle Body (Faceted Glass) -->
    <polygon points="50,65 130,65 140,195 40,195" fill="url(#perfumeGlass)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <!-- Specular Highlight reflection -->
    <path d="M 60 75 L 75 75 L 65 185 L 50 185 Z" fill="rgba(255, 255, 255, 0.4)"/>
    <!-- Perfume label plate -->
    <rect x="62" y="110" width="56" height="40" rx="4" fill="rgba(0,0,0,0.6)" stroke="#fb7185" stroke-width="1"/>
    <text x="90" y="128" font-family="'Space Grotesk', sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">LUMIÈRE</text>
    <text x="90" y="140" font-family="'Space Grotesk', sans-serif" font-size="6" fill="#fb7185" text-anchor="middle">ÉLIXIR PUR</text>

    <!-- 360 degree rotation helper -->
    <path d="M 35 220 C 35 235, 145 235, 145 220" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="90" y="242" font-family="'Space Grotesk', sans-serif" font-size="9" fill="#fda4af" text-anchor="middle">↻ Drag to rotate in 3D</text>
  </g>

  <!-- Right: Product Description & Shaders Info -->
  <g transform="translate(320, 105)">
    <text x="0" y="25" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Élixir de Soie N°5</text>
    <text x="0" y="50" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#a0aec0">Real-time WebGL Caustic Shader</text>
    <text x="0" y="90" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="900" fill="#fb7185">$ 280.00</text>

    <!-- Shader material attributes -->
    <g transform="translate(0, 115)">
      <rect width="100" height="28" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
      <text x="12" y="18" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#e2e8f0">Roughness: 0.04</text>

      <rect x="110" width="100" height="28" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
      <text x="122" y="18" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#e2e8f0">IOR: 1.52 (Glass)</text>
    </g>

    <!-- Buy Button -->
    <rect y="160" width="220" height="40" rx="8" fill="url(#roseGold)" filter="url(#pinkGlow)"/>
    <text x="110" y="185" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">ADD TO 3D CART</text>
  </g>
</svg>

