<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="vibeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a16"/>
      <stop offset="50%" stop-color="#0c0d1e"/>
      <stop offset="100%" stop-color="#04050a"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#vibeBg)"/>
  <rect width="600" height="380" rx="16" fill="none" stroke="rgba(168, 85, 247, 0.35)" stroke-width="1.5"/>

  <!-- Top bar -->
  <rect x="25" y="24" width="550" height="38" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)"/>
  <text x="45" y="48" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" fill="#ffffff">VIBELOCATE AI // SPATIAL MAP 3D</text>
  <rect x="360" y="32" width="200" height="22" rx="11" fill="rgba(168, 85, 247, 0.15)" stroke="rgba(168, 85, 247, 0.4)"/>
  <text x="375" y="47" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#c084fc">🔍 "Quiet penthouse with sea view"</text>

  <!-- 3D Isometric District Map with Procedural Buildings -->
  <g transform="translate(100, 90)">
    <!-- Base Isometric Grid -->
    <polygon points="200,240 380,140 200,40 20,140" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1"/>
    
    <!-- Isometric Grid lines -->
    <line x1="110" y1="90" x2="290" y2="190" stroke="rgba(168, 85, 247, 0.15)"/>
    <line x1="290" y1="90" x2="110" y2="190" stroke="rgba(168, 85, 247, 0.15)"/>

    <!-- Building 1 (Left Tall Tower) -->
    <polygon points="120,120 150,105 150,55 120,70" fill="#3b0764"/>
    <polygon points="150,105 180,120 180,70 150,55" fill="#581c87"/>
    <polygon points="120,70 150,55 180,70 150,85" fill="#9333ea" filter="url(#purpleGlow)"/>

    <!-- Building 2 (Central AI Selected Tower) -->
    <polygon points="180,160 220,140 220,60 180,80" fill="#4c1d95"/>
    <polygon points="220,140 260,160 260,80 220,60" fill="#6d28d9"/>
    <polygon points="180,80 220,60 260,80 220,100" fill="url(#purpleGrad)" filter="url(#purpleGlow)"/>
    <!-- Holographic Pin Beacon -->
    <line x1="220" y1="60" x2="220" y2="15" stroke="#f472b6" stroke-width="2" filter="url(#purpleGlow)"/>
    <circle cx="220" cy="15" r="5" fill="#ffffff" filter="url(#purpleGlow)"/>
    
    <!-- Info Bubble -->
    <g transform="translate(230, -5)">
      <rect width="130" height="42" rx="6" fill="rgba(15, 23, 42, 0.9)" stroke="#c084fc" stroke-width="1"/>
      <text x="10" y="18" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="bold" fill="#ffffff">Skyline Penthouse</text>
      <text x="10" y="32" font-family="'Space Grotesk', sans-serif" font-size="9" fill="#a855f7">Vibe Score: 98% Match</text>
    </g>

    <!-- Building 3 (Right Complex) -->
    <polygon points="250,190 280,175 280,135 250,150" fill="#1e1b4b"/>
    <polygon points="280,175 310,190 310,150 280,135" fill="#312e81"/>
    <polygon points="250,150 280,135 310,150 280,165" fill="#4338ca"/>
  </g>
</svg>

