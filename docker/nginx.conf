server {
    listen PORT_PLACEHOLDER default_server;
    listen [::]:PORT_PLACEHOLDER default_server;

    server_name _;
    root /var/www/html/public;

    index index.php index.html;
    charset utf-8;

    # Support up to 50MB payloads (for 30MB media file uploads)
    client_max_body_size 50M;

    # Gzip Compression for 3D textures, JSON payloads, and assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml font/woff2 application/wasm;

    # Serve static assets directly with long cache lifetime
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|glb|gltf|bin|mp3|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Laravel Front Controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pass PHP scripts to FastCGI server listening on 127.0.0.1:9000
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Deny access to hidden dotfiles (except .well-known)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}

